<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Subida</title>
</head>
<body style="padding: 30px; font-family: sans-serif;">
    <h2>Probar Subida de Foto de Perfil</h2>
    
    <!-- El atributo enctype es INDISPENSABLE para enviar archivos -->
    <form action="../backend/update_profile.php" method="POST" enctype="multipart/form-data">
        <label>Selecciona una foto (.jpg / .png):</label><br><br>
        <input type="file" name="foto" accept="image/*" required><br><br>
        
        <button type="submit">Subir e Inyectar en BD</button>
    </form>
</body>
</html>
