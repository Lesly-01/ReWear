<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    body
    .white-box {
      background-color: #FFFFFF;
      width: 100%;
      min-height: 40px;
      height: auto;
      display: flex;
      flex-direction: column; 
      align-items: flex-start;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 2px;
    }

    .field-title {
      color: #634C1B;
      font-weight: 800;
      font-size: 20px;
    }

    .field-label {
      color: #634C1B;
      font-weight: 700;
      font-size: 16px;
    }

    .post-date {
      color: #634C1B;
      font-weight: 700;
      font-size: 13px;
      text-align: right;
      margin-top: 8px;
    }
    </style>
</head>
<body>
  <div class="row g-4">
    
    <div class="col-12 col-md-6 col-lg-4">
      <div class="clothing-card d-flex">
        

        <div class="card card-producto p-2">
  <div class="row g-0 align-items-center h-100">
    
  
    <div class="col-8 d-flex flex-column justify-content-between h-100 pe-2">
      <div class="info-box border p-2 mb-1">
        <h5 class="m-0 fs-6 fw-bold">Floral Denim Jacket</h5>
      </div>
      <div class="info-box border p-2 mb-1 text-center">
        <span>S / M / XL</span>
      </div>
      <div class="info-box border p-2 text-center">
        <strong class="fw-bold">$20.00</strong>
      </div>
    </div>

    
    <div class="col-4 h-100">
      <div class="image-container h-100">
        <img src="/img/Patched jeans.png" alt="Floral Denim Jacket" class="img-fluid-fit">
      </div>
    </div>

  </div>
</div>

<div class="text-center mt-2">
  <button class="btn btn-custom">View post</button>
</div>
    
</body>
</html>
