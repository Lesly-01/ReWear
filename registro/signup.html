<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReWear</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg diseño-de-navbar">
        <div class="container">
            <a class="navbar-brand" href=""></a>
            <img class="logo_rewear"  src="/IMG/ReWear logo.png" alt="">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                   <li class="nav-item"><a class="nav-link" href="/Home/homepage.html">Home</a></li>
                   <li class="nav-item"><a class="nav-link" href="/clothes/clothes.html">Clothes</a></li>
                   <li class="nav-item"><a class="nav-link" href="/Miperfil/myprofile.html">My profile</a></li>
                   <li class="nav-item"><a class="nav-link" href="/reviews/reviews.html">Reviews</a></li>
                   <li class="nav-item"><a class="nav-link" href="/aboutus/aboutus.html">About us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="d-flex align-items-center justify-content-center min-vh-100 my-4">
    
    <div class="login-card container shadow-lg p-0 overflow-hidden">
      <div class="row g-0 align-items-center">
        

        <div class="col-md-5 hero-image-container d-flex align-items-center justify-content-center p-4">
          <img src="" alt="ReWear Eco" class="img-fluid floating-img">
        </div>

  
        <div class="col-md-7 form-container p-4 p-md-5 d-flex flex-column justify-content-center align-items-center text-center">
          
          <h1 class="fw-bold title-text mb-1">Create an account</h1>
          <p class="subtitle-text mb-3">Join us and start making a difference today</p>

      
          <form class="w-100 p-4 mb-3">
            
            <div class="mb-3 text-start">
              <input type="email" class="form-control custom-input" placeholder="Email address" required>
            </div>

            <div class="mb-3 text-start">
              <input type="text" class="form-control custom-input" placeholder="Username" required>
            </div>

            <div class="mb-3 text-start">
              <input type="tel" class="form-control custom-input" placeholder="Phone number" required>
            </div>

            <div class="mb-3 text-start">
              <input type="password" class="form-control custom-input" placeholder="Password" required>
            </div>

            <div class="mb-2 text-start">
              <input type="password" class="form-control custom-input" placeholder="Confirm password" required>
            </div>

          
            <div class="form-check text-start mt-3">
              <input class="form-check-input custom-checkbox" type="checkbox" id="termsCheck" required>
              <label class="form-check-label terms-text" for="termsCheck">
                I agree to the <a href="#" class="terms-link">Terms & Conditions</a>
              </label>
            </div>

          </form>

      
          <a href="/clothes/clothes.html"    type="submit" class="btn btn-custom-submit w-50 py-2 mb-3">Sign up</a>
          <p class="signup-text m-0">Already have an account? <a href="/iniciosesion/login.html" class="signup-link fw-bold">Log in</a></p>

        </div>

      </div>
    </div>

  </main>

  
    
</body>
</html>
